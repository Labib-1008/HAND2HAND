<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>User Profile Management</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

body{
    background:#eef2f7;
    font-family:Arial;
}

/* Sidebar */

.sidebar{
    width:260px;
    height:100vh;
    background:#0f172a;
    position:fixed;
    padding:20px;
}

.sidebar h2{
    color:white;
    text-align:center;
    margin-bottom:30px;
}

.sidebar a{
    display:block;
    color:#cbd5e1;
    text-decoration:none;
    padding:14px;
    margin-bottom:10px;
    border-radius:10px;
}

.sidebar a:hover{
    background:#1e293b;
    color:white;
}

/* Main */

.main-content{
    margin-left:280px;
    padding:30px;
}

/* Profile Card */

.profile-card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0px 4px 15px rgba(0,0,0,0.08);
}

.profile-header{
    display:flex;
    align-items:center;
    gap:20px;
}

.profile-img{
    width:120px;
    height:120px;
    border-radius:50%;
    border:5px solid #2563eb;
}

.verified-badge{
    background:#22c55e;
    color:white;
    padding:7px 15px;
    border-radius:20px;
}

/* Stats */

.stats-card{
    background:white;
    padding:25px;
    border-radius:18px;
    margin-top:25px;
    text-align:center;
    box-shadow:0px 4px 10px rgba(0,0,0,0.08);
}

/* Buttons */

.update-btn{
    background:#2563eb;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
}

.password-btn{
    background:#16a34a;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
}

.logout-btn{
    background:#dc2626;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:10px;
}

/* Responsive */

@media(max-width:992px){

.sidebar{
    width:100%;
    height:auto;
    position:relative;
}

.main-content{
    margin-left:0;
}

.profile-header{
    flex-direction:column;
    text-align:center;
}

}

</style>

</head>

<body>

<!-- Sidebar -->

<div class="sidebar">

<h2>HAND2HAND</h2>

<a href="#"><i class="fa fa-user"></i> My Profile</a>

<a href="#"><i class="fa fa-hand-holding-heart"></i> Donations</a>

<a href="#"><i class="fa fa-clock"></i> History</a>

<a href="#"><i class="fa fa-gear"></i> Settings</a>

<a href="#"><i class="fa fa-right-from-bracket"></i> Logout</a>

</div>

<!-- Main -->

<div class="main-content">

<div class="profile-card">

<div class="profile-header">

<img src="https://i.pravatar.cc/150"
class="profile-img">

<div>

<h3>Fatema Rahman</h3>

<p class="text-muted">
fatema@gmail.com
</p>

<span class="verified-badge">

Verified User

</span>

</div>

</div>

<hr>

<form>

<div class="row">

<div class="col-md-6 mb-4">

<label>Full Name</label>

<input type="text"
class="form-control"
value="Fatema Rahman">

</div>

<div class="col-md-6 mb-4">

<label>Email</label>

<input type="email"
class="form-control"
value="fatema@gmail.com">

</div>

</div>

<div class="row">

<div class="col-md-6 mb-4">

<label>Phone Number</label>

<input type="text"
class="form-control"
value="+8801700000000">

</div>

<div class="col-md-6 mb-4">

<label>Address</label>

<input type="text"
class="form-control"
value="Dhaka, Bangladesh">

</div>

</div>

<div class="mb-4">

<label>Upload Profile Picture</label>

<input type="file"
class="form-control">

</div>

<button type="button"
class="update-btn">

Update Profile

</button>

<button type="button"
class="password-btn">

Change Password

</button>

<button type="button"
class="logout-btn">

Logout

</button>

</form>

</div>

<!-- Stats -->

<div class="row">

<div class="col-md-4">

<div class="stats-card">

<h3>45</h3>

<p>Total Donations</p>

</div>

</div>

<div class="col-md-4">

<div class="stats-card">

<h3>120</h3>

<p>Reward Points</p>

</div>

</div>

<div class="col-md-4">

<div class="stats-card">

<h3>Gold</h3>

<p>Donor Badge</p>

</div>

</div>

</div>

</div>

<script>

const updateBtn=
document.querySelector('.update-btn');

updateBtn.addEventListener('click',()=>{

alert('Profile Updated Successfully');

});

</script>

</body>
</html>
